<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ride Details — ChitRide</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

<style>
    :root {
        --bg: #0A0E1A;
        --bg-2: #10152B;
        --bg-3: #161C38;
        --maroon: #A82C3B;
        --maroon-soft: #D98A82;
        --cyan: #22E6C5;
        --amber: #FFB648;
        --text: #F1F3FA;
        --muted: #8B93B0;
        --line: rgba(241, 243, 250, 0.09);
        --glass: rgba(255, 255, 255, 0.04);
        --success: #22E6C5;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }
    h1, h2, .logo span { font-family: 'Space Grotesk', sans-serif; }
    a { color: inherit; text-decoration: none; }

    nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 40px;
        border-bottom: 1px solid var(--line);
    }

    .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; }
    .logo i { color: var(--cyan); font-size: 20px; }

    .back-link { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); cursor: pointer; transition: color 0.2s ease; border: none; background: none; font-family: 'Inter', sans-serif; }
    .back-link:hover { color: var(--text); }

    .page-wrap { display: flex; justify-content: center; padding: 50px 20px 100px; }

    .detail-card {
        width: 100%;
        max-width: 480px;
        background: var(--glass);
        border: 1px solid var(--line);
        backdrop-filter: blur(18px);
        border-radius: 18px;
        padding: 32px;
    }

    .driver-block {
        display: flex;
        align-items: center;
        gap: 16px;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 24px;
    }

    .driver-avatar-lg {
        width: 62px;
        height: 62px;
        border-radius: 50%;
        background: rgba(168, 44, 59, 0.16);
        color: var(--maroon-soft);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: 600;
        font-family: 'Space Grotesk', sans-serif;
        flex-shrink: 0;
    }

    .driver-name-lg { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .driver-rating-lg { font-size: 13px; color: var(--amber); margin-bottom: 6px; }

    .verified-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11.5px;
        color: var(--cyan);
        background: rgba(34, 230, 197, 0.1);
        border: 1px solid rgba(34, 230, 197, 0.3);
        padding: 3px 10px;
        border-radius: 20px;
    }

    .route-block { margin-bottom: 22px; }

    .route-line { display: flex; gap: 14px; margin-bottom: 4px; }

    .route-dots { display: flex; flex-direction: column; align-items: center; padding-top: 4px; }
    .dot-top { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); }
    .dot-line { width: 1px; flex: 1; background: var(--line); margin: 4px 0; min-height: 24px; }
    .dot-bottom { width: 8px; height: 8px; border-radius: 50%; background: var(--maroon-soft); }

    .route-point { padding-bottom: 20px; }
    .route-point .label { font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
    .route-point .place { font-size: 14.5px; font-weight: 500; }

    .info-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-bottom: 24px;
    }

    .info-box {
        background: var(--bg-3);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
    }

    .info-box .label { font-size: 11.5px; color: var(--muted); margin-bottom: 6px; }
    .info-box .value { font-size: 15px; font-weight: 600; }

    .price-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 0;
        border-top: 1px solid var(--line);
        margin-bottom: 22px;
    }

    .price-row .label { color: var(--muted); font-size: 13.5px; }
    .price-row .value { font-size: 22px; font-weight: 600; color: var(--cyan); }

    .confirm-btn {
        width: 100%;
        background: var(--maroon);
        color: #fff;
        border: none;
        padding: 14px 0;
        border-radius: 9px;
        font-weight: 600;
        font-size: 14.5px;
        cursor: pointer;
        font-family: 'Inter', sans-serif;
        transition: filter 0.2s ease, transform 0.15s ease;
    }

    .confirm-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .confirm-btn:disabled { opacity: 0.6; cursor: default; }

    .form-msg { text-align: center; font-size: 13px; margin-top: 14px; color: var(--success); min-height: 16px; }
</style>
</head>

<body>

<nav>
    <div class="logo"><i class="fa-solid fa-car-side"></i><span>ChitRide</span></div>
    <button class="back-link" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i> Back to results</button>
</nav>

<div class="page-wrap">

    <div class="detail-card">

        <div class="driver-block">
            <div class="driver-avatar-lg" id="d-initials">HS</div>
            <div>
                <div class="driver-name-lg" id="d-name">Driver</div>
                <div class="driver-rating-lg" id="d-rating-block">&#9733; <span id="d-rating">4.8</span></div>
                <div class="verified-badge"><i class="fa-solid fa-shield-halved"></i> Verified Chitkara University student</div>
            </div>
        </div>

        <div class="route-block">
            <div class="route-line">
                <div class="route-dots">
                    <div class="dot-top"></div>
                    <div class="dot-line"></div>
                    <div class="dot-bottom"></div>
                </div>
                <div>
                    <div class="route-point">
                        <div class="label">Pickup</div>
                        <div class="place" id="d-from">Chitkara University</div>
                    </div>
                    <div class="route-point">
                        <div class="label">Drop</div>
                        <div class="place" id="d-to">Destination</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="info-grid">
            <div class="info-box">
                <div class="label">Date &amp; time</div>
                <div class="value" id="d-datetime">Today, 8:00 AM</div>
            </div>
            <div class="info-box">
                <div class="label">Seats left</div>
                <div class="value" id="d-seats">2</div>
            </div>
        </div>

        <div class="price-row">
            <div class="label">Price per seat</div>
            <div class="value" id="d-price">₹40</div>
        </div>

        <button class="confirm-btn" id="confirm-btn">Confirm Booking</button>
        <div class="form-msg" id="confirm-msg"></div>

    </div>

</div>

<script>
    var params = new URLSearchParams(window.location.search);

    var name = params.get('name') || 'Driver';
    var initials = params.get('initials') || name.charAt(0);
    var rating = params.get('rating');
    var time = params.get('time') || '8:00 AM';
    var price = params.get('price') || '40';
    var seats = params.get('seats') || '1';
    var from = params.get('from') || 'Chitkara University';
    var to = params.get('to') || 'Destination';
    var date = params.get('date');

    document.getElementById('d-name').textContent = name;
    document.getElementById('d-initials').textContent = initials;
    if (rating) {
        document.getElementById('d-rating-block').innerHTML = '&#9733; <span id="d-rating">' + rating + '</span>';
    } else {
        document.getElementById('d-rating-block').innerHTML = '<span style="color: var(--cyan);">New driver</span>';
    }
    document.getElementById('d-from').textContent = from;
    document.getElementById('d-to').textContent = to;
    document.getElementById('d-datetime').textContent = (date ? new Date(date).toDateString() : 'Today') + ', ' + time;
    document.getElementById('d-seats').textContent = seats;
    document.getElementById('d-price').textContent = '₹' + price;

    document.getElementById('confirm-btn').addEventListener('click', function () {
        var history = [];
        try { history = JSON.parse(localStorage.getItem('chitride_history')) || []; } catch (e) { history = []; }

        history.unshift({
            from: from,
            to: to,
            role: 'passenger',
            withName: name,
            date: date ? new Date(date).toDateString() : new Date().toDateString()
        });

        localStorage.setItem('chitride_history', JSON.stringify(history));

        this.disabled = true;
        this.textContent = 'Booked ✓';

        var msg = document.getElementById('confirm-msg');
        msg.textContent = 'Ride confirmed! Redirecting to your dashboard...';

        setTimeout(function () { window.location.href = 'dashboard.html'; }, 1000);
    });
</script>

</body>
</html>
